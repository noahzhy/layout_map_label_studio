services:
  nginx:
    build: .
    image: ccr.ccs.tencentyun.com/clobotics/label-studio:latest-arm64
    restart: unless-stopped
    ports:
      - "8080:8085"
      - "8081:8086"
    depends_on:
      - app
    environment:
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
    #   Optional: Set nginx error log level (default: warn)
    #   Use 'warn' or higher to reduce noisy "client closed keepalive connection" messages
    #      - NGINX_ERROR_LOG_LEVEL=warn
    #   Optional: Specify SSL termination certificate & key
    #   Just drop your cert.pem and cert.key into folder 'deploy/nginx/certs'
    #      - NGINX_SSL_CERT=/certs/cert.pem
    #      - NGINX_SSL_CERT_KEY=/certs/cert.key
    volumes:
      - ./mydata:/label-studio/data:rw
      - ./deploy/nginx/certs:/certs:ro
      # Layout viewer: mount static + data for nginx to serve
      - ./label_studio/layout_viewer/static/layout_viewer:/label-studio/label_studio/core/static_build/layout_viewer:ro
      # Mount updated nginx config with layout-data location block
      - ./deploy/default.conf:/etc/nginx/nginx.conf:ro
    #   Optional: Override nginx default conf
    #      - ./deploy/my.conf:/etc/nginx/nginx.conf
    command: nginx

  app:
    stdin_open: true
    tty: true
    build: .
    image: ccr.ccs.tencentyun.com/clobotics/label-studio:latest-arm64
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
      - JSON_LOG=1
      - LABEL_STUDIO_ENABLE_SIGNUP=true
      - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=false
    #      - LOG_LEVEL=DEBUG
    volumes:
      - ./mydata:/label-studio/data:rw
      # Layout viewer app (mount source to avoid full rebuild)
      - ./label_studio/layout_viewer:/label-studio/label_studio/layout_viewer:ro
      - ./label_studio/core/urls.py:/label-studio/label_studio/core/urls.py:ro
      - ./label_studio/core/settings/base.py:/label-studio/label_studio/core/settings/base.py:ro
    command: label-studio-uwsgi

  db:
    image: ccr.ccs.tencentyun.com/clobotics/pgautoupgrade:17-alpine-arm64
    hostname: db
    restart: unless-stopped
    ports:
      - "5432:5432"
    # Optional: Enable TLS on PostgreSQL
    # Just drop your server.crt and server.key into folder 'deploy/pgsql/certs'
    # NOTE: Both files must have permissions u=rw (0600) or less
    #    command: >
    #      -c ssl=on
    #      -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
    #      -c ssl_key_file=/var/lib/postgresql/certs/server.key
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
    volumes:
      - ${POSTGRES_DATA_DIR:-./postgres-data}:/var/CHClib/postgresql/data
      - ./deploy/pgsql/certs:/var/lib/postgresql/certs:ro
