{% extends 'simple.html' %}
{% load i18n %}
{% load static %}
{% load filters %}


{% block head %}
<link rel="stylesheet" href="{{ settings.HOSTNAME }}{% static 'css/fonts.hellix.css' %}"/>
<link rel="stylesheet" href="{{ settings.HOSTNAME }}{% static 'css/login.css' %}"/>

<style>
  /* ===== Clobotics Login Branding ===== */
  .login_page_new_ui .left {
    background: linear-gradient(150deg, #0a1628 0%, #102040 55%, #0d2a52 100%) !important;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 3rem 3.5rem;
  }
  .login_page_new_ui .left::after {
    /* remove default Label Studio background image */
    display: none !important;
  }
  /* decorative radial glow */
  .cb-glow {
    position: absolute;
    top: -120px;
    right: -120px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(240,122,48,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  /* dot-grid decoration */
  .cb-grid {
    position: absolute;
    bottom: 40px;
    left: 40px;
    width: 180px;
    height: 180px;
    background-image: radial-gradient(circle, rgba(255,255,255,0.12) 1.5px, transparent 1.5px);
    background-size: 18px 18px;
    pointer-events: none;
  }
  .cb-brand {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .cb-logo-img {
    height: 52px;
    filter: brightness(0) invert(1);
    margin-bottom: 1.8rem;
    display: block;
  }
  .cb-product {
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #f07a30;
    margin-top: 0.5rem;
    margin-bottom: 2.2rem;
  }
  .cb-tagline {
    font-size: 1.5rem;
    font-weight: 300;
    color: rgba(255,255,255,0.9);
    line-height: 1.45;
    margin: 0 0 2.4rem;
  }
  .cb-tagline em {
    font-style: normal;
    font-weight: 700;
    color: #f07a30;
  }
  .cb-features {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .cb-features li {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    color: rgba(255,255,255,0.75);
    font-size: 0.9rem;
    margin-bottom: 0.85rem;
  }
  .cb-features li::before {
    content: '';
    flex-shrink: 0;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #f07a30;
  }
  .cb-footer {
    position: relative;
    z-index: 1;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.35);
    margin-top: 2rem;
  }
</style>
{% if settings.COLLECT_ANALYTICS %}
<script async src="https://www.googletagmanager.com/gtag/js?id=UA-129877673-1" nonce="{{request.csp_nonce}}"></script>
<script nonce="{{request.csp_nonce}}">
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'UA-129877673-1');
</script>
{% endif %}
{% endblock %}

{% block content %}
<script nonce="{{request.csp_nonce}}">
  window.APP_SETTINGS = window.APP_SETTINGS ?? {};
  window.APP_SETTINGS.collect_analytics = {{ settings.COLLECT_ANALYTICS|yesno:"true,false" }};

  // Log event to the server, if analytics are enabled
  // This is a fallback for when the __lsa global is not defined
  // Normally this is a part of our main bundle but these pages do not use the main bundle
  // and this allows us to log events from these pages
  const logEvent = (eventName, metadata = {}) => {
    if (!window.APP_SETTINGS?.collect_analytics) return;

    const payload = {
      ...metadata,
      event: eventName,
      url: window.location.href,
    };

    window.requestIdleCallback(() => {
      const params = new URLSearchParams({ __: JSON.stringify(payload) });
      const url = `/__lsa/?${params}`;
      try {
        if (navigator.sendBeacon) {
          navigator.sendBeacon(url);
        } else {
          const img = new Image();
          img.src = url;
        }
      } catch {
        // Ignore errors here
      }
    });
  };
  if (!window.__lsa) {
    window.__lsa = logEvent;
  }
</script>

<script nonce="{{request.csp_nonce}}">
  const gaClientIdTrackingIframe = (event) => {
    if (!window.APP_SETTINGS?.collect_analytics) return;
    
    const iframe = document.createElement("iframe");
    window.addEventListener("message", (message) => {
      if(message.source === iframe.contentWindow && message.data.gaClientId) {
        sessionStorage.setItem('ls_gaclient_id', message.data.gaClientId);
      }
    });
    const origin = window.location.origin;
    iframe.src = `https://labelstud.io/track/?event=${event}&origin=${origin}`;
    iframe.style.display = "none";
    iframe.style.visibility = "hidden";
    document.body.appendChild(iframe);
  }
</script>

<div class="login_page_new_ui">
  <div class="left">
    <div class="cb-glow"></div>
    <div class="cb-grid"></div>
    <div class="cb-brand">
      <img src="https://clobotics.com/wp-content/uploads/2020/08/logo-dark.png" class="cb-logo-img" alt="Clobotics">
    </div>
    <div class="cb-footer">&copy; 2026 Clobotics 版权所有</div>
  </div>
  <div class="right">
    {% block user_content %}
  </div>
</div>

  {% endblock %}
{% endblock %}
