<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sub-Category 分类翻译对照表</title>
  <style>
    :root {
      --bg: #f6f6f3;
      --panel: #ffffff;
      --ink: #222426;
      --muted: #6b6f76;
      --line: #deded8;
      --accent: #d8402e;
      --accent-soft: #fff1ee;
      --nav: #2f5149;
      --nav-soft: #e8f1ee;
      --shadow: 0 14px 34px rgba(24, 28, 31, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.45;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .wrap {
      width: min(1240px, calc(100vw - 32px));
      margin: 0 auto;
    }
    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      padding: 30px 0 22px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      max-width: 780px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(108px, 1fr));
      gap: 10px;
      min-width: 380px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .num {
      display: block;
      font-size: 24px;
      font-weight: 740;
      line-height: 1.1;
    }
    .label {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }
    main {
      padding: 20px 0 44px;
    }
    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 16px;
      align-items: start;
    }
    .sidebar, .content {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .sidebar {
      position: sticky;
      top: 14px;
      overflow: hidden;
    }
    .side-head {
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }
    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid #c9cac5;
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 0 12px;
      font: inherit;
    }
    .merchant-list {
      max-height: calc(100vh - 190px);
      overflow: auto;
      padding: 8px;
    }
    .merchant-button {
      width: 100%;
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      padding: 8px 10px;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }
    .merchant-button:hover {
      background: #f2f2ee;
    }
    .merchant-button.active {
      background: var(--nav-soft);
      color: var(--nav);
      font-weight: 720;
    }
    .content-head {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) 260px 240px 180px;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }
    h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .result-count {
      color: var(--muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .category-section {
      border-bottom: 1px solid var(--line);
      padding: 16px 14px;
    }
    .category-section:last-child {
      border-bottom: 0;
    }
    .category-title {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
      align-items: baseline;
    }
    h3 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }
    .category-zh {
      color: var(--accent);
      font-weight: 720;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #a93224;
      font-size: 12px;
      font-weight: 680;
      white-space: nowrap;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
    }
    th {
      color: #555a60;
      background: #f4f4f0;
      font-size: 12px;
      font-weight: 720;
    }
    .en {
      color: #24282d;
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    .zh {
      color: var(--accent);
      font-weight: 720;
      overflow-wrap: anywhere;
    }
    .empty {
      display: none;
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
    }
    footer {
      color: var(--muted);
      font-size: 12px;
      padding-top: 14px;
    }
    @media (max-width: 900px) {
      .hero, .layout, .content-head {
        grid-template-columns: 1fr;
      }
      .stats {
        min-width: 0;
      }
      .sidebar {
        position: static;
      }
      .merchant-list {
        max-height: 260px;
      }
      .result-count {
        text-align: left;
      }
      th {
        display: none;
      }
      table, tbody, tr, td {
        display: block;
        width: 100%;
      }
      tr {
        border-top: 1px solid var(--line);
      }
      td {
        border-top: 0;
        padding: 7px 10px;
      }
      td:first-child {
        padding-top: 11px;
      }
      td:last-child {
        padding-bottom: 11px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap hero">
      <div>
        <h1>Sub-Category 分类翻译对照表</h1>
        <p class="subtitle">按原始 YAML 层级展示：先选商店，再按 Category 查看对应 Sub-Category；中文翻译会参考所在 Category 的业务语境。</p>
      </div>
      <div class="stats" aria-label="汇总统计">
        <div class="stat"><span class="num">21</span><span class="label">商店</span></div>
        <div class="stat"><span class="num">119</span><span class="label">唯一 Category</span></div>
        <div class="stat"><span class="num">721</span><span class="label">唯一 Sub-Category</span></div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="layout">
      <aside class="sidebar">
        <div class="side-head">
          <input id="merchantSearch" type="search" placeholder="搜索商店..." autocomplete="off">
        </div>
        <div class="merchant-list" id="merchantList"></div>
      </aside>
      <section class="content">
        <div class="content-head">
          <h2 id="merchantTitle"></h2>
          <input id="subSearch" type="search" placeholder="搜索 Sub-Category..." autocomplete="off">
          <select id="categoryFilter" aria-label="按 Category 筛选">
            <option value="">全部 Category</option>
          </select>
          <div class="result-count"><span id="shown">0</span> 个 Sub-Category</div>
        </div>
        <div id="categoryContainer"></div>
        <div class="empty" id="empty">没有匹配的分类。请调整商店、Category 或搜索词。</div>
      </section>
    </div>
    <footer>注：中文翻译为业务梳理初稿，已优先按 Category + Sub-Category 组合翻译，并校验中文翻译字段不残留英文字母；英文列仅用于对照原始分类名称。</footer>
  </main>

    let activeMerchant = data[0].merchant;

    const merchantSearch = document.getElementById('merchantSearch');
    const merchantList = document.getElementById('merchantList');
    const merchantTitle = document.getElementById('merchantTitle');
    const subSearch = document.getElementById('subSearch');
    const categoryFilter = document.getElementById('categoryFilter');
    const categoryContainer = document.getElementById('categoryContainer');
    const shown = document.getElementById('shown');
    const empty = document.getElementById('empty');

    function escapeText(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function currentMerchant() {
      return data.find(item => item.merchant === activeMerchant) || data[0];
    }

    function renderMerchants() {
      const q = merchantSearch.value.trim().toLowerCase();
      const merchants = data.filter(item => item.merchant.toLowerCase().includes(q));
      merchantList.innerHTML = merchants.map(item => `
        <button class="merchant-button ${item.merchant === activeMerchant ? 'active' : ''}" data-merchant="${escapeText(item.merchant)}">
          ${escapeText(item.merchant)}
        </button>
      `).join('');
      merchantList.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          activeMerchant = button.dataset.merchant;
          render();
        });
      });
    }

    function renderCategoryOptions(merchant) {
      const selected = categoryFilter.value;
      categoryFilter.innerHTML = '<option value="">全部 Category</option>';
      for (const category of merchant.categories) {
        const option = document.createElement('option');
        option.value = category.name;
        option.textContent = `${category.name} / ${category.translation}`;
        categoryFilter.appendChild(option);
      }
      if ([...categoryFilter.options].some(option => option.value === selected)) {
        categoryFilter.value = selected;
      }
    }

    function renderContent() {
      const merchant = currentMerchant();
      merchantTitle.textContent = merchant.merchant;
      renderCategoryOptions(merchant);
      const selectedCategory = categoryFilter.value;
      const subQuery = subSearch.value.trim().toLowerCase();
      const categories = merchant.categories
        .filter(category => !selectedCategory || category.name === selectedCategory)
        .map(category => {
          const subs = category.subs.filter(sub => {
            if (!subQuery) return true;
            return `${sub.name} ${sub.translation}`.toLowerCase().includes(subQuery);
          });
          return { ...category, subs, totalSubs: category.subs.length };
        })
        .filter(category => category.subs.length > 0);
      let subCount = 0;
      categoryContainer.innerHTML = categories.map(category => {
        subCount += category.subs.length;
        const rows = category.subs.map(sub => `
          <tr>
            <td><div class="en">${escapeText(sub.name)}</div></td>
            <td><div class="zh">${escapeText(sub.translation)}</div></td>
          </tr>
        `).join('');
        return `
          <section class="category-section">
            <div class="category-title">
              <h3>${escapeText(category.name)} <span class="category-zh">/ ${escapeText(category.translation)}</span></h3>
              <span class="badge">${category.subs.length} / ${category.totalSubs} 项</span>
            </div>
            <table>
              <thead>
                <tr><th>Sub-Category 原文</th><th>中文翻译</th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </section>
        `;
      }).join('');
      shown.textContent = subCount;
      empty.style.display = subCount ? 'none' : 'block';
    }

    function render() {
      renderMerchants();
      renderContent();
    }

    merchantSearch.addEventListener('input', renderMerchants);
    subSearch.addEventListener('input', renderContent);
