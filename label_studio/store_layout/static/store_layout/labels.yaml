# Annotation labels configuration
# Groups map to labeling Levels 1-6
# label_metadata section defines type (bbox/polygon/attribute), level, and color per group

labels:

  boundary:
    - Boundary

  inner-structure:
    - Inner-Wall

  fixture:
    - Entrance
    - Exit
    - Entrance/Exit
    - Checkout
    - Shelf
    - Wall Shelf
    - Checkout-Shelf
    - Refrigerator
    - Endcap
    - Counter
    - Island
    - Cooler
    - Pharmacy
    - Restroom
    - Other

  aisle:
    - Aisle

  area:
    - None

  category:
    - No Longer Supported
    - Call Staff

label_metadata:
  boundary:
    type: polygon
    level: 1
    color: '#e74c3c'
  inner-structure:
    type: polygon
    level: 2
    color: '#8e44ad'
  fixture:
    type: bbox
    level: 3
    color: '#2980b9'
  aisle:
    type: bbox
    level: 4
    color: '#27ae60'
  area:
    type: polygon
    level: 5
    color: '#f39c12'
  category:
    type: attribute
    level: 6
    color: '#95a5a6'
